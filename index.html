<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1 stops iOS from zooming the layout when a small text
         field is focused; the document itself zooms with a pinch on the page.
         interactive-widget makes the on-screen keyboard shrink the layout so
         the tool bars stay reachable while typing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f3f5fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PDF Studio" />
    <title>PDF Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
